<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig on Android: the system fonts and the Liberation fonts OpenSCAD ships (the folder this file is in).
     The cache goes to $XDG_CACHE_HOME/fontconfig, which the app points at its cache directory. -->
<fontconfig>
  <dir>/system/fonts</dir>
  <dir>/product/fonts</dir>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <include ignore_missing="yes">10-liberation.conf</include>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Droid Sans Mono</family><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
